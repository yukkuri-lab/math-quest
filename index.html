<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>さんすうクエスト</title>
    <!-- Google Fonts: DotGothic16 for Pixel Art style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.515">

    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            alert(`Error: ${message}\nLine: ${lineno}\nSource: ${source}`);
        };
    </script>
</head>

<body>
    <div id="game-container">
        <!-- Title Screen -->
        <div id="title-screen" class="screen active">
            <div class="version">Ver 3.515</div>

            <div class="title-logo">
                <h1>さんすうクエスト</h1>
                <p>もんだいを といて<br>まぼろしのいきもの UMAを たおそう</p>
                <p style="font-size: 0.8rem; color: #ffeb3b; margin-top: 15px; margin-bottom: 0;">※iPhoneで音が出ない場合は<br>マナーモードを解除してね！</p>
            </div>

            <img id="title-hero" src="assets/hero.png" alt="勇者えいとくん">

            <div class="title-buttons">
                <button id="start-btn" class="pixel-btn">ぼうけんにでる</button>
                <button id="enc-btn" class="pixel-btn" style="font-size: 1.5rem;">📖 UMAずかん</button>
                <div style="display: flex; gap: 10px;">
                    <button id="sound-test-btn" class="pixel-btn small-btn">おと テスト</button>
                    <button id="reset-btn" class="pixel-btn small-btn">さいしょから</button>
                </div>
            </div>
            <div id="debug-info" style="display:none;"></div>
        </div>

        <!-- Map Screen (World Selection) -->
        <div id="map-screen" class="screen hidden">
            <h2 class="map-title">🗺 せかいを えらぼう！</h2>
            <div class="map-grid" id="map-grid">
                <!-- JavaScript で動的に生成 -->
            </div>
            <button id="map-back-btn" class="pixel-btn small-btn" style="margin-top: 20px;">タイトルにもどる</button>
        </div>

        <!-- Battle Screen (Hidden by default) -->
        <div id="battle-screen" class="screen hidden">
            <!-- Battle UI Elements -->
            <!-- Removed old stats box, using new individual ones -->

            <!-- Player Stats (Top Left) -->
            <div id="battle-player-stats" class="window-frame">
                <p class="name">えいとくん</p>
                <div class="stat-row">
                    <span>HP</span> <span id="battle-hero-hp">50</span>
                </div>
                <!-- Added Player HP Gauge -->
                <div id="hero-hp-gauge-container">
                    <div id="hero-hp-gauge-fill"></div>
                </div>
                <!-- Spacing -->
                <div class="stat-row" style="margin-top: 5px;">
                    <span>MP</span> <span id="battle-hero-mp">10</span>
                </div>
                <div class="stat-row">
                    <span>LV</span> <span id="battle-hero-lv">1</span>
                </div>
                <!-- Added EXP Display -->
                <div class="stat-row">
                    <span>EXP</span> <span id="battle-hero-exp">0</span>
                </div>
            </div>

            <div id="battle-enemy-stats" class="window-frame hidden">
                <p id="battle-enemy-name">モンスター</p>
                <!-- Added Enemy HP Number -->
                <div class="stat-row" style="justify-content: flex-end; margin-bottom: 2px;">
                    <span>HP</span> <span id="battle-enemy-hp">100</span>
                </div>
                <div id="enemy-hp-gauge-container">
                    <div id="hp-gauge-fill"></div>
                </div>
                <!-- Added Enemy Level -->
                <p id="battle-enemy-lv-container" style="text-align: right; margin-top: 5px; color: #fff;">
                    LV <span id="battle-enemy-lv">1</span>
                </p>
            </div>

            <div id="enemy-area">
                <!-- Removed window-frame class to remove border -->
                <div id="enemy-window">
                    <div id="enemy-sprite">😈</div>
                </div>
            </div>

            <div id="message-window" class="window-frame">
                <p id="game-message">モンスターが あらわれた！<span id="message-cursor">▼</span></p>
            </div>

        </div>

        <!-- Command Menu (Moved to Root) -->
        <div id="command-menu" class="window-frame hidden">
            <div class="command-grid">
                <button class="command-btn" data-cmd="fight">たたかう</button>
                <button class="command-btn" data-cmd="spell">じゅもん</button>
                <button class="command-btn" data-cmd="run">にげる</button>
                <button class="command-btn" data-cmd="item">どうぐ</button>
                <button class="command-btn" data-cmd="save">きろく</button>
            </div>
        </div>

        <!-- Question Area (Rush Mode) -->
        <div id="question-area" class="question-area hidden">
            <!-- Feedback Overlay -->
            <div id="feedback-overlay" class="hidden"></div>

            <div id="question-window">
                <div id="question-text">8 + 5 = ?</div>
            </div>
            <div id="answer-buttons">
                <button class="answer-btn"></button>
                <button class="answer-btn"></button>
                <button class="answer-btn"></button>
                <button class="answer-btn"></button>
            </div>
        </div>
    <!-- Encyclopedia Screen (Hidden by default) -->
        <div id="encyclopedia-screen" class="screen hidden" style="background-color: #111; padding: 15px;">
            <div id="encyclopedia-content" class="window-frame" style="max-height: 95vh; display: flex; flex-direction: column; overflow: hidden; padding: 20px;">
                <!-- Content injected by JS -->
            </div>
        </div>

    </div>

    <div class="version-display">Ver 3.515</div>    <!-- Audio Elements -->
    <audio id="bgm-title" loop>
        <source src="assets/bgm_title.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgm-battle" loop>
        <source src="assets/bgm_battle.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgm-boss" loop>
        <source src="assets/bgm_boss.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-pi">
        <source src="assets/sfx_pi.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-attack">
        <source src="assets/sfx_attack.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-damage">
        <source src="assets/sfx_damage.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-win">
        <source src="assets/sfx_win.mp3" type="audio/mpeg">
    </audio>

    <script src="enemies.js?v=3.515"></script>
    <script src="game.js?v=3.515"></script>
</body>

</html>
